name: Playwright E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Start Docker services (solo esenciales: postgres, mongo, auth)"
        run: |
          cd backend/Auth-Python
          docker compose up -d postgres-db mongo-db auth-python
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci

      - name: "Wait for Auth server"
        run: |
          echo "Waiting for Auth server..."
          for i in $(seq 1 40); do
            if curl -s http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Auth server ready"
              break
            fi
            echo "Waiting... ($i/40)"
            sleep 5
          done

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: "Install dependencies"
        run: |
          pip install playwright pytest pytest-html pytest-playwright
          playwright install chromium --with-deps

      - name: "Run Playwright tests (solo tests que no requieren frontends)"
        run: pytest test/ -v --html=report.html --self-contained-html --junitxml=results.xml -p no:parallel -k "not integration"
        env:
          CI: true

      - name: "Test Report"
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results
          path: results.xml
          reporter: java-junit
          fail-on-error: false

      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: report.html
          retention-days: 14

      - name: "Upload test results"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: "Stop Docker services"
        if: always()
        run: |
          cd backend/Auth-Python
          docker compose down -v
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci