name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker services
        run: |
          cd backend/Auth-Python
          docker compose up -d
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Auth server ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

          for i in $(seq 1 20); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Client Admin ready"
              break
            fi
            sleep 3
          done

          for i in $(seq 1 20); do
            if curl -s http://localhost:5174 > /dev/null 2>&1; then
              echo "Client User ready"
              break
            fi
            sleep 3
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install playwright pytest pytest-html
          playwright install chromium --with-deps

      - name: Run Playwright tests
        run: pytest test/ -v --html=report.html --self-contained-html
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: report.html
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: |
          cd backend/Auth-Python
          docker compose down -v
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci
