name: Playwright E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: transmetro-ci
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Auth-Python with cache
        run: |
          cd backend/Auth-Python
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -t transmetro-auth-python:latest \
            -f Dockerfile .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Pull base images for other services
        run: |
          docker pull postgres:16-alpine
          docker pull mongo:6.0

      - name: Start Docker services
        run: |
          cd backend/Auth-Python
          docker compose up -d --build
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci

      - name: Wait for Auth server
        run: |
          echo "Waiting for Auth server (port 8080)..."
          for i in {1..40}; do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "Auth server ready"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 5
          done
          echo "Timeout waiting for Auth server"
          docker compose logs auth-python
          exit 1
        continue-on-error: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright pytest pytest-html pytest-playwright psycopg2-binary
          playwright install chromium --with-deps

      - name: Run Playwright tests (exclude Stripe)
        id: pytest
        run: |
          pytest test/ -v -k "not stripe" --junitxml=results.xml --tb=short
        env:
          CI: true

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results
          path: results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Stop Docker services
        if: always()
        run: |
          cd backend/Auth-Python
          docker compose down -v
        env:
          COMPOSE_PROJECT_NAME: transmetro-ci
