[project]
name = "client-user-mobile"
version = "1.0.0"
description = "Tconecta Ciudadano Mobile - Python/Flet"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.25.0",
    "flet-map>=0.25.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
