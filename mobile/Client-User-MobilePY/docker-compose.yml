services:
  build:
    build: .
    user: builder
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - ANDROIDSDK=/home/builder/.buildozer/android/platform/android-sdk
      - ANDROIDNDK=/home/builder/.buildozer/android/platform/android-ndk-r28c
      - ANDROIDAPI=33
      - ANDROIDMINAPI=21
    volumes:
      - .:/home/builder/app
    command: >
      bash -c "set -e;
      cd /home/builder/app;
      echo '=== Building APK ===';
      buildozer android debug 2>&1"
