services:
  build:
    build: .
    user: builder
    environment:
      - PATH=/home/builder/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - .:/home/builder/app
    command: >
      bash -c "sudo chown -R builder:builder /home/builder/app/app /home/builder/app/bin /home/builder/app/pyproject.toml /home/builder/app/buildozer.spec 2>/dev/null;
      cd /home/builder/app;
      buildozer android debug 2>&1 || true;
      yes | /home/builder/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-33' 2>/dev/null;
      buildozer android debug 2>&1"
