[project]
name = "client-user"
version = "1.0.0"
description = "Tconecta User Client - Python/FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
