# =============================================================
#  Docker Compose para CI - Solo servicios esenciales
# =============================================================

services:

  # ============================================================
  # BASES DE DATOS
  # ============================================================

  postgres-db:
    image: postgres:16-alpine
    container_name: transmetro_postgres_ci
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TransmetroAuthDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-db:
    image: mongo:6.0
    container_name: transmetro_mongo_ci
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================
  # MICROSERVICIO DE AUTENTICACIÓN — Python/FastAPI
  # ============================================================

  auth-python:
    build:
      context: .
      dockerfile: Dockerfile
    image: transmetro-auth-python:ci
    container_name: transmetro_auth_python_ci
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-db:5432/TransmetroAuthDb
      - MONGODB_URI=mongodb://mongo-db:27017/TransmetroUserDb
      - JWT_SECRET=A_SUPER_SECRET_KEY_FOR_TRANSMETRO_CONECTA_12345
      - JWT_ISSUER=TransmetroAuthServer
      - JWT_AUDIENCE=TransmetroUsers
      - JWT_EXPIRES_IN=120
      - JWT_RESET_EXPIRES_IN=15
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

# =============================================================
# VOLÚMENES Y REDES
# =============================================================

volumes:
  pgdata:
  mongodata:

networks:
  transmetro_network:
    driver: bridge